name: Tenaska QSE Capacity Query

on:
  workflow_dispatch:          # Manual trigger from the Actions tab
    inputs:
      qse_name:
        description: 'QSE full name override (default: TENASKA POWER SERVICES CO)'
        required: false
        default: 'TENASKA POWER SERVICES CO'
      qse_code:
        description: 'QSE short code override (default: QTENSK)'
        required: false
        default: 'QTENSK'

jobs:
  query-ercot:
    name: Query ERCOT API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tenaska QSE capacity query
        env:
          ERCOT_USERNAME: ${{ secrets.ERCOT_USERNAME }}
          ERCOT_PASSWORD: ${{ secrets.ERCOT_PASSWORD }}
          ERCOT_SUB_KEY:  ${{ secrets.ERCOT_SUB_KEY }}
          QSE_NAME:       ${{ github.event.inputs.qse_name }}
          QSE_CODE:       ${{ github.event.inputs.qse_code }}
        run: python tenaska_qse_capacity.py

      - name: Upload results CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenaska-qse-results
          path: output/
          if-no-files-found: ignore
          retention-days: 30
